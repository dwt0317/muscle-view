# 骨骼表（唯一数据源之一）。
# id          : 内部 ID，肌肉表的 origin_bones / insertion_bones 引用它
# sided       : true -> 生成 <id>.r 与 <id>.l 两个节点；false -> 中线结构，单个节点
# za / za_re  : Z-Anatomy 网格名。za 是基础名列表（sided 时自动补 .r/.l）；
#               za_re 是对完整对象名的正则（{s} 会被替换为 r/l；sided=false 时忽略 {s}）
# body        : 刚体 ID（见 anatomy/skeleton.yaml，Task 10 使用）。sided 时自动变为 <body>.<side>
# context     : true -> 仅作解剖背景，不是重点部位（导出时减面更狠）
#
# 来源: Z-Anatomy (CC BY-SA 4.0)，基于 BodyParts3D。名称：英文为 Z-Anatomy/TA 对象名，拉丁文为 TA。

regions:
  shoulder: {zh: 肩, en: Shoulder, la: Articulatio humeri}
  hip:      {zh: 髋, en: Hip,      la: Articulatio coxae}
  knee:     {zh: 膝, en: Knee,     la: Articulatio genus}
  lumbar:   {zh: 腰, en: Lumbar spine, la: Regio lumbalis}

bones:
  # ---- 肩 ----
  - {id: scapula,   za: [Scapula],   sided: true, body: scapula,  regions: [shoulder], name: {zh: 肩胛骨, en: Scapula,  la: Scapula}}
  - {id: clavicle,  za: [Clavicle],  sided: true, body: clavicle, regions: [shoulder], name: {zh: 锁骨,   en: Clavicle, la: Clavicula}}
  - {id: humerus,   za: [Humerus],   sided: true, body: humerus,  regions: [shoulder], name: {zh: 肱骨,   en: Humerus,  la: Humerus}}
  - {id: manubrium, za: [Manubrium of sternum], sided: false, body: thorax, regions: [shoulder], name: {zh: 胸骨柄, en: Manubrium of sternum, la: Manubrium sterni}}
  - {id: sternum_body, za: [Body of sternum],   sided: false, body: thorax, regions: [shoulder], name: {zh: 胸骨体, en: Body of sternum,       la: Corpus sterni}}
  - {id: xiphoid,   za: [Xiphoid process],      sided: false, body: thorax, regions: [lumbar],   name: {zh: 剑突,   en: Xiphoid process,       la: Processus xiphoideus}}
  - id: ribs
    za_re: '^(First|Second|Third|Fourth|Fifth|Sixth|Seventh|Eighth|Ninth|Tenth|Eleventh|Twelfth) rib\.{s}$'
    sided: true
    body: thorax
    regions: [shoulder, lumbar]
    name: {zh: 肋骨, en: Ribs, la: Costae}
  - id: costal_cartilages
    za_re: '^Costal cartilage of \w+ rib\.{s}$'
    sided: true
    body: thorax
    regions: [shoulder, lumbar]
    name: {zh: 肋软骨, en: Costal cartilages, la: Cartilagines costales}
  - id: thoracic_spine
    za_re: '^Vertebra T\d+$'
    sided: false
    body: thorax
    regions: [lumbar, shoulder]
    name: {zh: 胸椎, en: Thoracic vertebrae, la: Vertebrae thoracicae}
  - id: cervical_spine
    za_re: '^(Atlas \(C1\)|Axis \(C2\)|Vertebra C\d+)$'
    sided: false
    body: thorax
    regions: [shoulder]
    context: true
    name: {zh: 颈椎, en: Cervical vertebrae, la: Vertebrae cervicales}
  - id: skull
    za_re: '^(Frontal bone|Occipital bone|Sphenoid bone|Ethmoid bone|Mandible|Vomer|(Parietal|Temporal|Zygomatic|Nasal|Lacrimal|Palatine) bone|Maxilla|Inferior nasal concha bone)(\.[rl])?$'
    sided: false
    body: thorax
    regions: [shoulder]
    context: true
    name: {zh: 颅骨, en: Skull, la: Cranium}
  - id: forearm_hand
    za_re: '^(Radius|Ulna|Scaphoid bone|Lunate bone|Triquetrum bone|Pisiform bone|Trapezium bone|Trapezoid bone|Capitate bone|Hamate bone|\w+ metacarpal bone|\w+ phalanx of \w+ finger of hand)\.{s}$'
    sided: true
    body: humerus
    regions: [shoulder]
    context: true
    name: {zh: 前臂与手骨, en: Forearm and hand bones, la: Ossa antebrachii et manus}

  # ---- 腰 ----
  - {id: vertebra_l1, za: [Vertebra L1], sided: false, body: l1, regions: [lumbar], name: {zh: 第1腰椎, en: L1 vertebra, la: Vertebra lumbalis I}}
  - {id: vertebra_l2, za: [Vertebra L2], sided: false, body: l2, regions: [lumbar], name: {zh: 第2腰椎, en: L2 vertebra, la: Vertebra lumbalis II}}
  - {id: vertebra_l3, za: [Vertebra L3], sided: false, body: l3, regions: [lumbar], name: {zh: 第3腰椎, en: L3 vertebra, la: Vertebra lumbalis III}}
  - {id: vertebra_l4, za: [Vertebra L4], sided: false, body: l4, regions: [lumbar], name: {zh: 第4腰椎, en: L4 vertebra, la: Vertebra lumbalis IV}}
  - {id: vertebra_l5, za: [Vertebra L5], sided: false, body: l5, regions: [lumbar], name: {zh: 第5腰椎, en: L5 vertebra, la: Vertebra lumbalis V}}

  # ---- 髋 ----
  - {id: hip_bone, za: [Hip bone], sided: true,  body: pelvis, regions: [hip, lumbar], name: {zh: 髋骨, en: Hip bone, la: Os coxae}}
  - {id: sacrum,   za: [Sacrum],   sided: false, body: pelvis, regions: [hip, lumbar], name: {zh: 骶骨, en: Sacrum,   la: Os sacrum}}
  - {id: coccyx,   za: [Coccyx],   sided: false, body: pelvis, regions: [hip],         name: {zh: 尾骨, en: Coccyx,   la: Os coccygis}}

  # ---- 膝 ----
  - {id: femur,   za: [Femur],   sided: true, body: femur,   regions: [hip, knee], name: {zh: 股骨,   en: Femur,   la: Femur}}
  - {id: patella, za: [Patella], sided: true, body: patella, regions: [knee],      name: {zh: 髌骨,   en: Patella, la: Patella}}
  - {id: tibia,   za: [Tibia],   sided: true, body: tibia,   regions: [knee],      name: {zh: 胫骨,   en: Tibia,   la: Tibia}}
  - {id: fibula,  za: [Fibula],  sided: true, body: tibia,   regions: [knee],      name: {zh: 腓骨,   en: Fibula,  la: Fibula}}
  - id: foot
    za_re: '^(Calcaneus|Talus|Navicular bone|Cuboid bone|\w+ cuneiform bone|\w+ metatarsal bone|\w+ phalanx of \w+ finger of foot|Sesamoid bones of foot)\.{s}$'
    sided: true
    body: tibia
    regions: [knee]
    context: true
    name: {zh: 足骨, en: Foot bones, la: Ossa pedis}
