# 肌肉表（唯一数据源）。覆盖肩、髋、膝、腰四个部位。
#
# 内容依据: Kendall《Muscles: Testing and Function》、Neumann《Kinesiology of the
# Musculoskeletal System》、Gray's Anatomy 的通行描述整理。
# *** 所有起止点与功能文字均为整理稿，尚未经临床审核（界面上标注"待临床确认"）。 ***
#
# id               内部 ID（小写蛇形）
# za               Z-Anatomy 网格基础名（左右侧自动补 .r/.l）。注意 Z-Anatomy 的
#                  trapezius 升部/降部名称与实际位置相反，下面已按几何位置纠正（见各条注释）。
# regions          所属部位（可多个）
# group            分组（见文件末尾 groups）
# layer            superficial | intermediate | deep（相对皮肤的深浅）
# kind             muscle(默认) | fascia（髂胫束为筋膜，不参与收缩着色）
# origin_bones / insertion_bones   起点/止点所在骨（bones.yaml 的 id），用于起止点自动提取
# tendinous: true  肌肉经长腱/腱膜止于骨，网格上看不到直接接触，起止点提取要放宽阈值
# via              （可选）肌肉绕过骨的途经点，用于肌肉长度：路径 = 起点中心 -> via -> 止点中心。
#                  {bone, dir, within(可选)}：该骨在某解剖方向上的极值点（同 landmarks.yaml 的取点方式）。
#                  没有 via 的肌肉用起点中心到止点中心的直线。via 不影响显示，只影响收缩/舒张着色。

muscles:
  # ======================= 肩 =======================
  - id: deltoid_clavicular
    za: Clavicular part of deltoid muscle
    regions: [shoulder]
    group: deltoid
    layer: superficial
    name:
      zh: "三角肌锁骨部（前束）"
      en: "Deltoid, clavicular part"
      la: "M. deltoideus, pars clavicularis"
    origin:
      zh: "锁骨外侧 1/3 前缘"
      en: "Anterior border of lateral third of clavicle"
    insertion:
      zh: "肱骨三角肌粗隆"
      en: "Deltoid tuberosity of humerus"
    origin_bones: [clavicle]
    insertion_bones: [humerus]
    function:
      zh: "肩前屈、水平内收、内旋"
      en: "Shoulder flexion, horizontal adduction, internal rotation"

  - id: deltoid_acromial
    za: Acromial part of deltoid muscle
    regions: [shoulder]
    group: deltoid
    layer: superficial
    name:
      zh: "三角肌肩峰部（中束）"
      en: "Deltoid, acromial part"
      la: "M. deltoideus, pars acromialis"
    origin:
      zh: "肩峰外缘"
      en: "Lateral margin of acromion"
    insertion:
      zh: "肱骨三角肌粗隆"
      en: "Deltoid tuberosity of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩外展（主要动力，15°–90°）"
      en: "Shoulder abduction (prime mover, 15°–90°)"

  - id: deltoid_spinal
    za: Scapular spinal part of deltoid muscle
    regions: [shoulder]
    group: deltoid
    layer: superficial
    name:
      zh: "三角肌肩胛冈部（后束）"
      en: "Deltoid, spinal part"
      la: "M. deltoideus, pars spinalis"
    origin:
      zh: "肩胛冈下缘"
      en: "Inferior border of spine of scapula"
    insertion:
      zh: "肱骨三角肌粗隆"
      en: "Deltoid tuberosity of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩后伸、水平外展、外旋"
      en: "Shoulder extension, horizontal abduction, external rotation"

  - id: supraspinatus
    za: Supraspinatus muscle
    regions: [shoulder]
    group: rotator_cuff
    layer: deep
    name:
      zh: "冈上肌"
      en: "Supraspinatus"
      la: "M. supraspinatus"
    origin:
      zh: "肩胛骨冈上窝"
      en: "Supraspinous fossa of scapula"
    insertion:
      zh: "肱骨大结节上部压迹"
      en: "Superior facet of greater tubercle of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "启动肩外展（0°–15°），稳定肱骨头于关节盂"
      en: "Initiates abduction (0°–15°); compresses humeral head into glenoid"

  - id: infraspinatus
    za: Infraspinatus muscle
    regions: [shoulder]
    group: rotator_cuff
    layer: deep
    name:
      zh: "冈下肌"
      en: "Infraspinatus"
      la: "M. infraspinatus"
    origin:
      zh: "肩胛骨冈下窝"
      en: "Infraspinous fossa of scapula"
    insertion:
      zh: "肱骨大结节中部压迹"
      en: "Middle facet of greater tubercle of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩外旋，稳定肱骨头"
      en: "Shoulder external rotation; stabilises humeral head"

  - id: teres_minor
    za: Teres minor muscle
    regions: [shoulder]
    group: rotator_cuff
    layer: deep
    name:
      zh: "小圆肌"
      en: "Teres minor"
      la: "M. teres minor"
    origin:
      zh: "肩胛骨外侧缘上 2/3 背面"
      en: "Dorsal surface of upper two thirds of lateral border of scapula"
    insertion:
      zh: "肱骨大结节下部压迹"
      en: "Inferior facet of greater tubercle of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩外旋，稳定肱骨头"
      en: "Shoulder external rotation; stabilises humeral head"

  - id: subscapularis
    za: Subscapularis muscle
    regions: [shoulder]
    group: rotator_cuff
    layer: deep
    name:
      zh: "肩胛下肌"
      en: "Subscapularis"
      la: "M. subscapularis"
    origin:
      zh: "肩胛骨肩胛下窝"
      en: "Subscapular fossa"
    insertion:
      zh: "肱骨小结节"
      en: "Lesser tubercle of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩内旋，前方稳定肱骨头"
      en: "Shoulder internal rotation; anterior stabiliser of humeral head"

  - id: teres_major
    za: Teres major muscle
    regions: [shoulder]
    group: back_arm
    layer: superficial
    name:
      zh: "大圆肌"
      en: "Teres major"
      la: "M. teres major"
    origin:
      zh: "肩胛骨下角及外侧缘下部背面"
      en: "Inferior angle and lower lateral border of scapula (dorsal)"
    insertion:
      zh: "肱骨小结节嵴"
      en: "Crest of lesser tubercle of humerus"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩后伸、内收、内旋"
      en: "Shoulder extension, adduction, internal rotation"

  - id: pectoralis_major_clavicular
    za: Clavicular head of pectoralis major muscle
    regions: [shoulder]
    group: pectoral
    layer: superficial
    name:
      zh: "胸大肌锁骨部"
      en: "Pectoralis major, clavicular head"
      la: "M. pectoralis major, pars clavicularis"
    origin:
      zh: "锁骨内侧半"
      en: "Medial half of clavicle"
    insertion:
      zh: "肱骨大结节嵴（结节间沟外侧唇）"
      en: "Crest of greater tubercle (lateral lip of intertubercular sulcus)"
    origin_bones: [clavicle]
    insertion_bones: [humerus]
    function:
      zh: "肩前屈、水平内收、内旋"
      en: "Shoulder flexion, horizontal adduction, internal rotation"

  - id: pectoralis_major_sternocostal
    za: Sternocostal head of pectoralis major muscle
    regions: [shoulder]
    group: pectoral
    layer: superficial
    name:
      zh: "胸大肌胸肋部"
      en: "Pectoralis major, sternocostal head"
      la: "M. pectoralis major, pars sternocostalis"
    origin:
      zh: "胸骨前面及第 1–6 肋软骨"
      en: "Anterior sternum and costal cartilages 1–6"
    insertion:
      zh: "肱骨大结节嵴（结节间沟外侧唇）"
      en: "Crest of greater tubercle (lateral lip of intertubercular sulcus)"
    origin_bones: [manubrium, sternum_body, costal_cartilages]
    insertion_bones: [humerus]
    function:
      zh: "肩内收、内旋，由屈位后伸"
      en: "Shoulder adduction, internal rotation; extension from flexed position"

  - id: pectoralis_major_abdominal
    za: (Abdominal part of pectoralis major muscle)
    regions: [shoulder]
    group: pectoral
    layer: superficial
    name:
      zh: "胸大肌腹部"
      en: "Pectoralis major, abdominal part"
      la: "M. pectoralis major, pars abdominalis"
    origin:
      zh: "腹直肌鞘前层（第 6–7 肋软骨附近）"
      en: "Anterior rectus sheath (near costal cartilages 6–7)"
    insertion:
      zh: "肱骨大结节嵴（结节间沟外侧唇）"
      en: "Crest of greater tubercle (lateral lip of intertubercular sulcus)"
    origin_bones: [costal_cartilages]
    insertion_bones: [humerus]
    function:
      zh: "肩下压、内收，由屈位后伸"
      en: "Shoulder depression, adduction; extension from flexed position"

  - id: pectoralis_minor
    za: Pectoralis minor muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: intermediate
    name:
      zh: "胸小肌"
      en: "Pectoralis minor"
      la: "M. pectoralis minor"
    origin:
      zh: "第 3–5 肋骨外面"
      en: "Outer surfaces of ribs 3–5"
    insertion:
      zh: "肩胛骨喙突"
      en: "Coracoid process of scapula"
    origin_bones: [ribs]
    insertion_bones: [scapula]
    function:
      zh: "肩胛前伸、下压、前倾"
      en: "Scapular protraction, depression, anterior tilt"

  - id: latissimus_dorsi
    za: Latissimus dorsi muscle
    regions: [shoulder, lumbar]
    group: back_arm
    layer: superficial
    name:
      zh: "背阔肌"
      en: "Latissimus dorsi"
      la: "M. latissimus dorsi"
    origin:
      zh: "T7–L5 棘突、胸腰筋膜、髂嵴后部、下 3–4 肋、肩胛下角"
      en: "Spinous processes T7–L5 via thoracolumbar fascia, posterior iliac crest, lower 3–4 ribs, inferior angle of scapula"
    insertion:
      zh: "肱骨结节间沟底"
      en: "Floor of intertubercular sulcus of humerus"
    origin_bones: [hip_bone, thoracic_spine, ribs, scapula]
    insertion_bones: [humerus]
    tendinous: true
    function:
      zh: "肩后伸、内收、内旋；经胸腰筋膜参与腰椎后伸"
      en: "Shoulder extension, adduction, internal rotation; assists lumbar extension via thoracolumbar fascia"

  # Z-Anatomy 将斜方肌升/降部命名颠倒（其 "Ascending part" 位于颈部，"Descending part" 延伸至 T12）。
  # 此处按实际几何位置映射：上部纤维=降部(descending)，下部纤维=升部(ascending)。
  - id: trapezius_descending
    za: Ascending part of trapezius muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: superficial
    name:
      zh: "斜方肌上部（降部）"
      en: "Trapezius, upper (descending) part"
      la: "M. trapezius, pars descendens"
    origin:
      zh: "枕外隆凸、上项线、项韧带"
      en: "External occipital protuberance, superior nuchal line, ligamentum nuchae"
    insertion:
      zh: "锁骨外侧 1/3、肩峰"
      en: "Lateral third of clavicle, acromion"
    origin_bones: [skull, cervical_spine]
    insertion_bones: [clavicle, scapula]
    function:
      zh: "肩胛上提、上回旋"
      en: "Scapular elevation and upward rotation"

  - id: trapezius_transverse
    za: Transverse part of trapezius muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: superficial
    name:
      zh: "斜方肌中部（横部）"
      en: "Trapezius, middle (transverse) part"
      la: "M. trapezius, pars transversa"
    origin:
      zh: "C7–T3 棘突"
      en: "Spinous processes C7–T3"
    insertion:
      zh: "肩峰、肩胛冈上缘"
      en: "Acromion and superior border of spine of scapula"
    origin_bones: [cervical_spine, thoracic_spine]
    insertion_bones: [scapula]
    function:
      zh: "肩胛后缩"
      en: "Scapular retraction"

  - id: trapezius_ascending
    za: Descending part of trapezius muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: superficial
    name:
      zh: "斜方肌下部（升部）"
      en: "Trapezius, lower (ascending) part"
      la: "M. trapezius, pars ascendens"
    origin:
      zh: "T4–T12 棘突"
      en: "Spinous processes T4–T12"
    insertion:
      zh: "肩胛冈内侧端（冈三角）"
      en: "Medial end of spine of scapula (trigonum spinae)"
    origin_bones: [thoracic_spine]
    insertion_bones: [scapula]
    function:
      zh: "肩胛下压、上回旋"
      en: "Scapular depression and upward rotation"

  - id: rhomboid_major
    za: Rhomboid major muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: intermediate
    name:
      zh: "大菱形肌"
      en: "Rhomboid major"
      la: "M. rhomboideus major"
    origin:
      zh: "T2–T5 棘突"
      en: "Spinous processes T2–T5"
    insertion:
      zh: "肩胛骨内侧缘（肩胛冈以下）"
      en: "Medial border of scapula below the spine"
    origin_bones: [thoracic_spine]
    insertion_bones: [scapula]
    function:
      zh: "肩胛后缩、下回旋"
      en: "Scapular retraction and downward rotation"

  - id: rhomboid_minor
    za: Rhomboid minor muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: intermediate
    name:
      zh: "小菱形肌"
      en: "Rhomboid minor"
      la: "M. rhomboideus minor"
    origin:
      zh: "C7–T1 棘突"
      en: "Spinous processes C7–T1"
    insertion:
      zh: "肩胛冈根部内侧缘"
      en: "Medial border of scapula at root of spine"
    origin_bones: [cervical_spine, thoracic_spine]
    insertion_bones: [scapula]
    function:
      zh: "肩胛后缩、下回旋"
      en: "Scapular retraction and downward rotation"

  - id: levator_scapulae
    za: Levator scapulae
    regions: [shoulder]
    group: scapular_stabilizers
    layer: intermediate
    name:
      zh: "肩胛提肌"
      en: "Levator scapulae"
      la: "M. levator scapulae"
    origin:
      zh: "C1–C4 横突后结节"
      en: "Posterior tubercles of transverse processes C1–C4"
    insertion:
      zh: "肩胛骨上角及内侧缘上部"
      en: "Superior angle and upper medial border of scapula"
    origin_bones: [cervical_spine]
    insertion_bones: [scapula]
    function:
      zh: "肩胛上提、下回旋"
      en: "Scapular elevation and downward rotation"

  - id: serratus_anterior
    za: Serratus anterior muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: superficial
    name:
      zh: "前锯肌"
      en: "Serratus anterior"
      la: "M. serratus anterior"
    origin:
      zh: "第 1–8（9）肋外面"
      en: "Outer surfaces of ribs 1–8 (9)"
    insertion:
      zh: "肩胛骨内侧缘前面及下角"
      en: "Anterior surface of medial border and inferior angle of scapula"
    origin_bones: [ribs]
    insertion_bones: [scapula]
    function:
      zh: "肩胛前伸、上回旋，使肩胛贴紧胸廓"
      en: "Scapular protraction and upward rotation; holds scapula against thorax"

  - id: subclavius
    za: Subclavius muscle
    regions: [shoulder]
    group: scapular_stabilizers
    layer: intermediate
    name:
      zh: "锁骨下肌"
      en: "Subclavius"
      la: "M. subclavius"
    origin:
      zh: "第 1 肋及肋软骨"
      en: "First rib and its cartilage"
    insertion:
      zh: "锁骨中 1/3 下面"
      en: "Inferior surface of middle third of clavicle"
    origin_bones: [ribs, costal_cartilages]
    insertion_bones: [clavicle]
    function:
      zh: "下压并稳定锁骨"
      en: "Depresses and stabilises clavicle"

  - id: coracobrachialis
    za: Coracobrachialis muscle
    regions: [shoulder]
    group: arm
    layer: intermediate
    name:
      zh: "喙肱肌"
      en: "Coracobrachialis"
      la: "M. coracobrachialis"
    origin:
      zh: "肩胛骨喙突尖"
      en: "Apex of coracoid process"
    insertion:
      zh: "肱骨内侧中部"
      en: "Medial surface of humerus, mid-shaft"
    origin_bones: [scapula]
    insertion_bones: [humerus]
    function:
      zh: "肩前屈、内收"
      en: "Shoulder flexion and adduction"

  - id: biceps_long
    za: Long head of biceps brachii
    regions: [shoulder]
    group: arm
    layer: superficial
    name:
      zh: "肱二头肌长头"
      en: "Biceps brachii, long head"
      la: "M. biceps brachii, caput longum"
    origin:
      zh: "肩胛骨盂上结节"
      en: "Supraglenoid tubercle of scapula"
    insertion:
      zh: "桡骨粗隆、前臂筋膜"
      en: "Radial tuberosity and bicipital aponeurosis"
    origin_bones: [scapula]
    insertion_bones: [forearm_hand]
    tendinous: true
    function:
      zh: "肩前屈、肘屈、前臂旋后"
      en: "Shoulder flexion, elbow flexion, forearm supination"

  - id: biceps_short
    za: Short head of biceps brachii
    regions: [shoulder]
    group: arm
    layer: superficial
    name:
      zh: "肱二头肌短头"
      en: "Biceps brachii, short head"
      la: "M. biceps brachii, caput breve"
    origin:
      zh: "肩胛骨喙突尖"
      en: "Apex of coracoid process"
    insertion:
      zh: "桡骨粗隆、前臂筋膜"
      en: "Radial tuberosity and bicipital aponeurosis"
    origin_bones: [scapula]
    insertion_bones: [forearm_hand]
    tendinous: true
    function:
      zh: "肩前屈、内收，肘屈、前臂旋后"
      en: "Shoulder flexion and adduction, elbow flexion, forearm supination"

  - id: triceps_long
    za: Long head of triceps brachii
    regions: [shoulder]
    group: arm
    layer: superficial
    name:
      zh: "肱三头肌长头"
      en: "Triceps brachii, long head"
      la: "M. triceps brachii, caput longum"
    origin:
      zh: "肩胛骨盂下结节"
      en: "Infraglenoid tubercle of scapula"
    insertion:
      zh: "尺骨鹰嘴"
      en: "Olecranon of ulna"
    origin_bones: [scapula]
    insertion_bones: [forearm_hand]
    tendinous: true
    function:
      zh: "肩后伸、内收，肘伸"
      en: "Shoulder extension and adduction, elbow extension"

  - id: triceps_lateral
    za: Lateral head of triceps brachii
    regions: [shoulder]
    group: arm
    layer: superficial
    name:
      zh: "肱三头肌外侧头"
      en: "Triceps brachii, lateral head"
      la: "M. triceps brachii, caput laterale"
    origin:
      zh: "肱骨后面桡神经沟上外侧"
      en: "Posterior humerus, superolateral to radial groove"
    insertion:
      zh: "尺骨鹰嘴"
      en: "Olecranon of ulna"
    origin_bones: [humerus]
    insertion_bones: [forearm_hand]
    tendinous: true
    function:
      zh: "肘伸"
      en: "Elbow extension"

  - id: triceps_medial
    za: Medial head of triceps brachii
    regions: [shoulder]
    group: arm
    layer: intermediate
    name:
      zh: "肱三头肌内侧头"
      en: "Triceps brachii, medial head"
      la: "M. triceps brachii, caput mediale"
    origin:
      zh: "肱骨后面桡神经沟下内侧"
      en: "Posterior humerus, inferomedial to radial groove"
    insertion:
      zh: "尺骨鹰嘴"
      en: "Olecranon of ulna"
    origin_bones: [humerus]
    insertion_bones: [forearm_hand]
    tendinous: true
    function:
      zh: "肘伸"
      en: "Elbow extension"

  # ======================= 髋 =======================
  - id: gluteus_maximus
    za: Gluteus maximus muscle
    regions: [hip]
    group: gluteal
    layer: superficial
    name:
      zh: "臀大肌"
      en: "Gluteus maximus"
      la: "M. gluteus maximus"
    origin:
      zh: "髂骨臀后线后方、骶骨与尾骨背面、骶结节韧带"
      en: "Ilium posterior to posterior gluteal line, dorsal sacrum and coccyx, sacrotuberous ligament"
    insertion:
      zh: "髂胫束、股骨臀肌粗隆"
      en: "Iliotibial tract and gluteal tuberosity of femur"
    origin_bones: [hip_bone, sacrum, coccyx]
    insertion_bones: [femur]
