      la: "M. rectus abdominis"
    origin:
      zh: "耻骨嵴与耻骨联合"
      en: "Pubic crest and pubic symphysis"
    insertion:
      zh: "第 5–7 肋软骨及剑突"
      en: "Costal cartilages 5–7 and xiphoid process"
    origin_bones: [hip_bone]
    insertion_bones: [costal_cartilages, xiphoid]
    function:
      zh: "躯干前屈（腰椎前屈）、后倾骨盆"
      en: "Trunk flexion (lumbar flexion); posterior pelvic tilt"

  - id: external_oblique
    za: External abdominal oblique muscle
    regions: [lumbar]
    group: abdominal_wall
    layer: superficial
    name:
      zh: "腹外斜肌"
      en: "External oblique"
      la: "M. obliquus externus abdominis"
    origin:
      zh: "第 5–12 肋外面"
      en: "Outer surfaces of ribs 5–12"
    insertion:
      zh: "髂嵴前部、腹白线（经腱膜）"
      en: "Anterior iliac crest and linea alba (via aponeurosis)"
    origin_bones: [ribs]
    insertion_bones: [hip_bone]
    tendinous: true
    function:
      zh: "躯干前屈、同侧侧屈、对侧旋转"
      en: "Trunk flexion, ipsilateral lateral flexion, contralateral rotation"

  - id: internal_oblique
    za: Internal abdominal oblique muscle
    regions: [lumbar]
    group: abdominal_wall
    layer: intermediate
    name:
      zh: "腹内斜肌"
      en: "Internal oblique"
      la: "M. obliquus internus abdominis"
    origin:
      zh: "胸腰筋膜、髂嵴、腹股沟韧带外侧 1/2"
      en: "Thoracolumbar fascia, iliac crest, lateral half of inguinal ligament"
    insertion:
      zh: "第 10–12 肋下缘、腹白线（经腱膜）"
      en: "Inferior borders of ribs 10–12 and linea alba (via aponeurosis)"
    origin_bones: [hip_bone]
    insertion_bones: [ribs, costal_cartilages]
    tendinous: true
    function:
      zh: "躯干前屈、同侧侧屈、同侧旋转"
      en: "Trunk flexion, ipsilateral lateral flexion, ipsilateral rotation"

  - id: transversus_abdominis
    za: Transversus abdominis muscle
    regions: [lumbar]
    group: abdominal_wall
    layer: deep
    name:
      zh: "腹横肌"
      en: "Transversus abdominis"
      la: "M. transversus abdominis"
    origin:
      zh: "髂嵴内唇、胸腰筋膜、下 6 肋软骨内面"
      en: "Inner lip of iliac crest, thoracolumbar fascia, inner surfaces of lower six costal cartilages"
    insertion:
      zh: "腹白线、耻骨嵴（经腱膜）"
      en: "Linea alba and pubic crest (via aponeurosis)"
    origin_bones: [hip_bone, costal_cartilages]
    insertion_bones: [hip_bone]
    tendinous: true
    function:
      zh: "收紧腹壁、增加腹内压，稳定腰椎"
      en: "Compresses abdomen and raises intra-abdominal pressure; stabilises lumbar spine"

  - id: quadratus_lumborum
    za: Quadratus lumborum muscle
    regions: [lumbar]
    group: lumbar_other
    layer: deep
    name:
      zh: "腰方肌"
      en: "Quadratus lumborum"
      la: "M. quadratus lumborum"
    origin:
      zh: "髂嵴后部及髂腰韧带"
      en: "Posterior iliac crest and iliolumbar ligament"
    insertion:
      zh: "第 12 肋下缘、L1–L4 横突"
      en: "Inferior border of 12th rib and transverse processes L1–L4"
    origin_bones: [hip_bone]
    insertion_bones: [ribs, vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4]
    function:
      zh: "腰椎同侧侧屈、提髋；双侧收缩稳定腰椎"
      en: "Ipsilateral lumbar lateral flexion, hip hiking; bilateral contraction stabilises lumbar spine"

  - id: iliocostalis_lumborum
    za: Iliocostalis lumborum muscle
    regions: [lumbar]
    group: erector_spinae
    layer: intermediate
    name:
      zh: "髂肋肌（腰部）"
      en: "Iliocostalis lumborum"
      la: "M. iliocostalis lumborum"
    origin:
      zh: "骶骨背面、髂嵴、胸腰筋膜"
      en: "Dorsal sacrum, iliac crest, thoracolumbar fascia"
    insertion:
      zh: "下 6–7 肋肋角"
      en: "Angles of lower 6–7 ribs"
    origin_bones: [sacrum, hip_bone]
    insertion_bones: [ribs]
    function:
      zh: "躯干后伸、同侧侧屈"
      en: "Trunk extension, ipsilateral lateral flexion"

  - id: iliocostalis_thoracis
    za: Iliocostalis thoracis muscle
    regions: [lumbar]
    group: erector_spinae
    layer: intermediate
    name:
      zh: "髂肋肌（胸部）"
      en: "Iliocostalis thoracis"
      la: "M. iliocostalis thoracis"
    origin:
      zh: "下 6 肋肋角"
      en: "Angles of lower six ribs"
    insertion:
      zh: "上 6 肋肋角、C7 横突"
      en: "Angles of upper six ribs and C7 transverse process"
    origin_bones: [ribs]
    insertion_bones: [ribs, cervical_spine]
    function:
      zh: "躯干后伸、同侧侧屈"
      en: "Trunk extension, ipsilateral lateral flexion"

  - id: longissimus_thoracis
    za: Longissimus thoracis muscle
    regions: [lumbar]
    group: erector_spinae
    layer: intermediate
    name:
      zh: "最长肌（胸部）"
      en: "Longissimus thoracis"
      la: "M. longissimus thoracis"
    origin:
      zh: "骶骨背面、髂嵴、腰椎棘突与横突"
      en: "Dorsal sacrum, iliac crest, lumbar spinous and transverse processes"
    insertion:
      zh: "胸椎横突及下 9–10 肋肋结节与肋角之间"
      en: "Thoracic transverse processes and ribs between tubercle and angle (lower 9–10)"
    origin_bones: [sacrum, hip_bone, vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5]
    insertion_bones: [thoracic_spine, ribs]
    function:
      zh: "躯干后伸、同侧侧屈"
      en: "Trunk extension, ipsilateral lateral flexion"

  - id: spinalis_thoracis
    za: Spinalis thoracis muscle
    regions: [lumbar]
    group: erector_spinae
    layer: intermediate
    name:
      zh: "棘肌（胸部）"
      en: "Spinalis thoracis"
      la: "M. spinalis thoracis"
    origin:
      zh: "T10–L2 棘突"
      en: "Spinous processes T10–L2"
    insertion:
      zh: "T1–T8 棘突"
      en: "Spinous processes T1–T8"
    origin_bones: [thoracic_spine, vertebra_l1, vertebra_l2]
    insertion_bones: [thoracic_spine]
    function:
      zh: "躯干后伸"
      en: "Trunk extension"

  - id: multifidus_lumborum
    za: Multifidus lumborum muscle
    regions: [lumbar]
    group: transversospinalis
    layer: deep
    name:
      zh: "多裂肌（腰部）"
      en: "Multifidus lumborum"
      la: "M. multifidus lumborum"
    origin:
      zh: "骶骨背面、髂后上棘、L1–L5 乳突"
      en: "Dorsal sacrum, posterior superior iliac spine, mammillary processes L1–L5"
    insertion:
      zh: "上方 2–4 个椎体的棘突"
      en: "Spinous processes of vertebrae 2–4 levels above"
    origin_bones: [sacrum, hip_bone, vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5]
    insertion_bones: [vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5, thoracic_spine]
    function:
      zh: "腰椎节段性稳定、后伸、对侧旋转"
      en: "Segmental lumbar stabilisation, extension, contralateral rotation"

  - id: multifidus_thoracis
    za: Multifidus thoracis muscle
    regions: [lumbar]
    group: transversospinalis
    layer: deep
    name:
      zh: "多裂肌（胸部）"
      en: "Multifidus thoracis"
      la: "M. multifidus thoracis"
    origin:
      zh: "胸椎横突"
      en: "Thoracic transverse processes"
    insertion:
      zh: "上方 2–4 个椎体的棘突"
      en: "Spinous processes of vertebrae 2–4 levels above"
    origin_bones: [thoracic_spine]
    insertion_bones: [thoracic_spine]
    function:
      zh: "胸椎稳定、后伸、对侧旋转"
      en: "Thoracic stabilisation, extension, contralateral rotation"

  - id: semispinalis_thoracis
    za: Semispinalis thoracis muscle
    regions: [lumbar]
    group: transversospinalis
    layer: deep
    name:
      zh: "半棘肌（胸部）"
      en: "Semispinalis thoracis"
      la: "M. semispinalis thoracis"
    origin:
      zh: "T6–T10 横突"
      en: "Transverse processes T6–T10"
    insertion:
      zh: "C6–T4 棘突"
      en: "Spinous processes C6–T4"
    origin_bones: [thoracic_spine]
    insertion_bones: [thoracic_spine, cervical_spine]
    function:
      zh: "胸椎后伸、对侧旋转"
      en: "Thoracic extension, contralateral rotation"

  - id: rotatores
    za: Rotatores
    regions: [lumbar]
    group: transversospinalis
    layer: deep
    name:
      zh: "回旋肌"
      en: "Rotatores"
      la: "Mm. rotatores"
    origin:
      zh: "各椎骨横突"
      en: "Transverse process of each vertebra"
    insertion:
      zh: "上一（或二）个椎骨椎板下缘与棘突根部"
      en: "Lamina and spinous process base of the vertebra above (or two above)"
    origin_bones: [thoracic_spine, vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5]
    insertion_bones: [thoracic_spine, vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5]
    function:
      zh: "节段性本体感觉与稳定、对侧旋转"
      en: "Segmental proprioception and stability; contralateral rotation"

  - id: interspinales_lumborum
    za: Interspinales lumborum muscles
    regions: [lumbar]
    group: lumbar_other
    layer: deep
    name:
      zh: "腰棘间肌"
      en: "Interspinales lumborum"
      la: "Mm. interspinales lumborum"
    origin:
      zh: "腰椎棘突上缘"
      en: "Superior surface of lumbar spinous processes"
    insertion:
      zh: "上一腰椎棘突下缘"
      en: "Inferior surface of the spinous process above"
    origin_bones: [vertebra_l2, vertebra_l3, vertebra_l4, vertebra_l5]
    insertion_bones: [vertebra_l1, vertebra_l2, vertebra_l3, vertebra_l4]
    function:
      zh: "腰椎后伸、节段稳定"
      en: "Lumbar extension and segmental stability"

  - id: serratus_posterior_inferior
    za: Serratus posterior inferior muscle
    regions: [lumbar]
    group: lumbar_other
    layer: intermediate
    name:
      zh: "下后锯肌"
      en: "Serratus posterior inferior"
      la: "M. serratus posterior inferior"
    origin:
      zh: "T11–L2 棘突（经胸腰筋膜）"
      en: "Spinous processes T11–L2 (via thoracolumbar fascia)"
    insertion:
      zh: "第 9–12 肋下缘"
      en: "Inferior borders of ribs 9–12"
    origin_bones: [thoracic_spine, vertebra_l1, vertebra_l2]
    insertion_bones: [ribs]
    function:
      zh: "下拉下位肋骨，辅助呼气与胸腰段稳定"
      en: "Draws lower ribs down; assists expiration and thoracolumbar stability"

